plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lantern.adbhider'
    compileSdk 34

    defaultConfig {
        applicationId "com.lantern.adbhider"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
