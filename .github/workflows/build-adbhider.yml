name: Build AdbHider Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            adbhider
          sparse-checkout-cone-mode: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          cd adbhider
          ls -la app/libs
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show outputs
        run: |
          find adbhider/app/build/outputs -name "*.apk" -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adbhider-apk
          path: adbhider/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
